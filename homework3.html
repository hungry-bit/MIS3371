<!DOCTYPE html>
<html>
    <head>
        <title> New Patient Form </title>
        <link rel="stylesheet" href="styles.css">
        <script src="hw3.js"></script>
    </head>
    <body>
        <div id="header">
            <table width="100%">
                <tbody>
                    <tr>
                        <td>
                            <img id="logo" src="newlogo.png" alt="logo" width="15%">
                        </td>
                        <td valign="top">Icarus Medical</td>
                        <td valign="bottom" align="right">
                            "Today's date: "
                            <span id="today"> </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div><br>
        <div id="body">    
            <form>
                <table id="PIform" name="PIform" class="form" frame="box">
                    <tbody>
                        <tr> <!-- form header-->
                            <th class="form" colspan="3"> New Patient Information </th>
                        </tr>
                        <tr> <!-- req. name input -->
                            <td>
                                <label> Name:</label>
                                <!--firstName-->
                                <input type="text" id="firstName" name="firstName" required placeholder="First Name"
                                title="First name must be between 2 and 30 characters and can contain only letters, dashes, and apostrophes."
                                minlength="2" maxlength="30"
                                oninput="validateFirstName()">
                                <!--middleInitial-->
                                <input type="text" size = "1" id="middleInitial" 
                                name="middleInitial" placeholder="M.I."
                                title="Middle initial must be a single letter."
                                minlength="1" maxlength="1"
                                oninput="validateMI()">
                                <!--lastName-->
                                <input type="text" id="lastName" name="lastName" required 
                                placeholder="Last Name"
                                title="Last name must be between 2 and 30 characters and can contain only letters, dashes, and apostrophes."
                                minlength="2" maxlength="30"
                                oninput="validateLastName()">
                                <!--error messages-->
                                <br>
                                <span id="firstNameError" class="error"></span>
                                <span id="lastNameError" class="error"></span>
                                <span id="middleInitialError" class="error"></span>
                            </td>
                        </tr>
                        <tr><!--usrname and password-->
                            <td>
                                <label>Please create a username and password:</label><br>
                                <!--error messages-->
                                <span id="usernameError" class="error"></span>
                                <span id="passwordError" class="error"></span>
                                <br>
                                <!--username-->
                                <span>Username:</span>
                                <input type="text" id="username" name="username" required placeholder="Required" 
                                minlength="3" maxlength="20"
                                title="Username must be between 3 and 20 characters and can contain only letters, numbers, underscores, and hyphens." 
                                oninput="validateUsername()"
                                ><br>
                                <!--password first-->
                                <span>Password:</span>
                                <input type="password" id="password" name="password" required 
                                placeholder="min 8 characters" minlength="8" maxlength="30"
                                title="Password must be between 8 and 30 characters."
                                oninput="validatePassword()"><br>
                                <!--2ndpassword-->
                                <span>Re-enter password:</span>
                                <input type="password" id="2ndpassword" name="2ndpassword" required 
                                placeholder="Passwords must match" minlength="8" maxlength="30"
                                title="Passwords must match."
                                oninput="validatePass2()">
                            </td>
                        </tr>
                        <tr> <!-- date of birth and sex input -->
                            <td> 
                                <label for="DOB">Date of Birth:</label>
                                <input type="date" id="DOB" name="DOB" required onchange="validateDOB()"
                                title="Date of birth must be your actual date of birth.">
                                <label for="sex">Sex:</label>
                                <select id="sex" name="sex" required onchange="validateSex()"
                                title="Please select your sex.">
                                    <option value="">Select Sex</option>
                                    <option value="male">Male</option>
                                    <option value="female">Female</option>
                                    <option value="other">Other</option>
                                </select>
                                <!--error messages-->
                                <br>
                                <span id="dobError" class="error"></span>
                                <span id="sexError" class="error"></span>
                            </td>
                        </tr>
                        <tr> <!-- address line 1 & 2 input -->
                            <td>
                                <label for="address1">Address Line 1:</label>
                                <input type="text" id="address1" name="address1" required 
                                maxlength="30" placeholder="Required" oninput="validateAddress()"
                                title="Address line 1 must be between 2 and 30 characters."><br>
                                <label for="address2">Address Line 2:</label>
                                <input type="text" id="address2" name="address2" placeholder="Optional" 
                                maxlength="30" oninput="validateAddress()" 
                                title="Address line 2 is not required, but if entered, must be between 2 and 30 characters.">
                                <!--error messages-->
                                <br>
                                <span id="address1Error" class="error"></span>
                                <span id="address2Error" class="error"></span>
                            </td>
                        </tr>
                        <tr> <!-- city, state, zip input -->
                            <td>
                                <label for="city">City:</label>
                                <input type="text" id="city" name="city" required maxlength="30" 
                                placeholder="Required" oninput="validateCity()"
                                title="City must be between 2 and 30 characters and can contain only letters, dashes, and apostrophes.">
                                <label for="state">State:</label>
                                <select id="state" name="state" required onchange="validateState()" 
                                title="Please select your state."> <!--copied from https://www.freeformatter.com/usa-state-list-html-select.html-->
                                    <option value="">Select State</option>
                                    <option value="AL">Alabama</option>
	                                <option value="AK">Alaska</option>
	                                <option value="AZ">Arizona</option>
	                                <option value="AR">Arkansas</option>
	                                <option value="CA">California</option>
	                                <option value="CO">Colorado</option>
	                                <option value="CT">Connecticut</option>
	                                <option value="DE">Delaware</option>
	                                <option value="DC">District Of Columbia</option>
	                                <option value="FL">Florida</option>
	                                <option value="GA">Georgia</option>
	                                <option value="HI">Hawaii</option>
	                                <option value="ID">Idaho</option>
	                                <option value="IL">Illinois</option>
	                                <option value="IN">Indiana</option>
	                                <option value="IA">Iowa</option>
	                                <option value="KS">Kansas</option>
	                                <option value="KY">Kentucky</option>
	                                <option value="LA">Louisiana</option>
	                                <option value="ME">Maine</option>
	                                <option value="MD">Maryland</option>
	                                <option value="MA">Massachusetts</option>
	                                <option value="MI">Michigan</option>
	                                <option value="MN">Minnesota</option>
	                                <option value="MS">Mississippi</option>
	                                <option value="MO">Missouri</option>
	                                <option value="MT">Montana</option>
	                                <option value="NE">Nebraska</option>
	                                <option value="NV">Nevada</option>
	                                <option value="NH">New Hampshire</option>
	                                <option value="NJ">New Jersey</option>
	                                <option value="NM">New Mexico</option>
	                                <option value="NY">New York</option>
	                                <option value="NC">North Carolina</option>
	                                <option value="ND">North Dakota</option>
	                                <option value="OH">Ohio</option>
	                                <option value="OK">Oklahoma</option>
	                                <option value="OR">Oregon</option>
	                                <option value="PA">Pennsylvania</option>
	                                <option value="RI">Rhode Island</option>
	                                <option value="SC">South Carolina</option>
	                                <option value="SD">South Dakota</option>
	                                <option value="TN">Tennessee</option>
	                                <option value="TX">Texas</option>
	                                <option value="UT">Utah</option>
	                                <option value="VT">Vermont</option>
	                                <option value="VA">Virginia</option>
	                                <option value="WA">Washington</option>
	                                <option value="WV">West Virginia</option>
	                                <option value="WI">Wisconsin</option>
	                                <option value="WY">Wyoming</option>
                                </select>
                                <label for="zip">Zip Code:</label>
                                <input type="text" id="zip" name="zip" required placeholder="Required" oninput="validateZip()"
                                title="Zip code must be a five-digit number." maxlength="5">
                                <!--error message-->
                                <br>
                                <span id="cityError" class="error"></span>
                                <span id="stateError" class="error"></span>
                                <span id="zipError" class="error"></span>
                            </td>
                        </tr>
                        <tr> <!-- phone number and email input -->
                            <td>
                                <label for="phone">Phone Number:</label>
                                <input type="tel" id="phone" name="phone" required placeholder="Required" maxlength="10"
                                oninput="validatePhone()"
                                title="Phone number must be a 10-digit number.">
                                <label for="email">Email:</label>
                                <input type="email" id="email" name="email" required placeholder="user@example.com" 
                                maxlength="50" oninput="validateEmail()"
                                title="Email must be a valid email address in the proper format (user@example.com).">
                                <br>
                                <span id="phoneError" class="error"></span>
                                <span id="emailError" class="error"></span>
                            </td>
                        </tr>
                        <tr><!--social security number-->
                            <td>
                                <label for="ssn">Social Security Number:</label>
                                <input type="password" id="ssn" name="ssn" required placeholder="000-00-0000" 
                                maxlength="11"
                                title="SSN must be a nine-digit number." oninput="validateSSN()">
                                <br>
                                <span id="ssnError" class="error"></span>
                            </td>
                        </tr>
                        <tr> <!-- Is insured? -->
                            <td> 
                                <label for="IsInsured">Do you have health insurance?</label>
                                <input type="radio" id="insuredYes" name="insuredYes" value="yes insurance" 
                                required onclick="validateInsurance()">
                                <span>Yes</span>
                                <input type="radio" id="insuredNo" name="insuredNo" value="no insurance" 
                                required onclick="validateInsurance()">
                                <span>No</span>
                                <br>
                                <span id="insuranceError" class="error"></span>
                            </td>
                        </tr>
                        <tr> <!-- marital status -->
                            <td>
                                <label for="marStatus">Marital Status:</label>
                                <input type="radio" id="married" name="married" value="married" 
                                required onclick="validateMaritalStatus()">
                                <span>Married</span>
                                <input type="radio" id="single" name="single" value="single" 
                                required onclick="validateMaritalStatus()">
                                <span>Single</span>
                                <br>
                                <span id="marStatusError" class="error"></span>
                            </td>
                        </tr>
                        <tr> <!--text area to describe symptoms-->
                            <td>
                                <label for="symptoms">Please describe your symptoms:</label><br>
                                <textarea id="symptoms" name="symptoms" rows="4" cols="50" 
                                placeholder="Please describe your symptoms in detail..."></textarea>
                            </td>
                        </tr>
                        <tr> <!-- checkboxes-->
                            <td>
                                <label> Please select all prexisting symptoms that apply to you:</label><br>
                                <input type="checkbox" id="diabetes" name="diabetes" value="diabetes">
                                <label for="diabetes">Diabetes</label>
                                <input type="checkbox" id="allergies" name="allergies" value="allergies">
                                <label for="allergies">Allergies</label>
                                <input type="checkbox" id="asthma" name="asthma" value="asthma">
                                <label for="asthma">Asthma</label>
                                <input type="checkbox" id="heartDisease" name="heartDisease" 
                                value="heartDisease">
                                <label for="heartDisease">Heart Disease</label>
                                <input type="checkbox" id="highBloodPressure" name="highBloodPressure" 
                                value="highBloodPressure">
                                <label for="highBloodPressure">High Blood Pressure</label>
                            </td>
                        </tr>
                        <tr><!--slide bar-->
                            <td>
                                <label> On a scale of 1-10, how severe are your symptoms?</label><br>
                                <input type="range" id="symptomSeverity" min="1" max="10" value="5"
                                oninput="document.getElementById('sliderValue').textContent = this.value">
                                <span id="sliderValue">5</span>
                            </td>
                        </tr>
                        <tr> <!-- preferred method of contact radio buttons-->
                            <td>
                                <label> Select preferred method of contact:</label>
                                <input type="radio" id="phonecontactpref" name="phonecontactpref" 
                                value="Phone Call preferred as contact" onchange="validateContactPref()">
                                <span> Phone Call:</span>
                                <input type="radio" id="txtmsgpref" name="textmsgpref" 
                                value="Text message preferred as contact" onchange="validateContactPref()">
                                <span> Text message:</span>
                                <input type="radio" id="emailcontactpref" name="emailcontactpref" 
                                value="email preferred contact" onchange="validateContactPref()">
                                <span> Email:</span>
                                <br>
                                <span id="contactPrefError" class="error"></span>
                            </td>
                        </tr>
                        <tr><!--submit and start over buttons-->
                            <td>
                                <input type="submit" id="submitBtn" value="Submit" onclick="return validateForm();">
                                <input type="reset" id="resetBtn" value="Start Over">
                            </td>
                        </tr>
                    </tbody>
                </table>    
            </form>
        </div>
        <div id="footer">
            <br>
            <input type="button" value="Back to Top" onclick="window.scrollTo(0, 0);">
            <span>Contact Information: support@icarusmedical.com</span>
        </div>
        <script> 
            document.getElementById("today").innerHTML = new Date().toLocaleDateString();
        </script>
    </body>
</html>
